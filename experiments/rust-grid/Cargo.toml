[package]
name = "herdr-grid-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
