name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Installer tests use tomllib; the installer requires Python 3.11+.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python run.py --version

  rust-comparison:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check Rust formatting and lint
        run: |
          cargo +stable fmt --manifest-path experiments/rust-grid/Cargo.toml --check
          cargo +stable clippy --locked --manifest-path experiments/rust-grid/Cargo.toml --all-targets -- -D warnings
      - name: Build comparison prototype
        run: cargo +stable build --release --locked --manifest-path experiments/rust-grid/Cargo.toml
      - name: Check same-data and terminal behavior
        run: python -m unittest discover -s tests -p test_rust_comparison.py -v
