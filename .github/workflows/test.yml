name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format, lint, and regression tests
        run: |
          cargo +stable fmt --all --check
          cargo +stable clippy --workspace --locked --all-targets -- -D warnings
          cargo +stable test --workspace --locked
      - name: Build release
        run: cargo +stable build --release --locked --workspace
      - name: Package and smoke-test native and source releases
        run: |
          cargo +stable xtask package --target '${{ matrix.target }}'
          cargo +stable xtask package
          mkdir -p dist/smoke dist/source
          tar -xzf dist/herdr-agent-grid-v*-${{ matrix.target }}.tar.gz -C dist/smoke
          tar -xzf dist/herdr-agent-grid-v*-source.tar.gz -C dist/source
          dist/smoke/herdr-agent-grid/install.sh --prepare-only
          dist/smoke/herdr-agent-grid/run.sh --version
          dist/smoke/herdr-agent-grid/run.sh --demo --render --icons unicode
          cargo +stable check --locked --workspace --manifest-path dist/source/herdr-agent-grid/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --workspace --all-targets
          cargo +1.88.0 test --locked --workspace
