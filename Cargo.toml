[package]
name = "herdr-agent-grid"
version = "2.0.1"
edition = "2024"
rust-version = "1.88"
description = "Your agents. One command center. A native Herdr dashboard."
license = "MIT"
repository = "https://github.com/jeffarese/herdr-agent-grid"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "herdr-agent-grid"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
walkdir = "2"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[workspace]
members = ["tools"]
default-members = [".", "tools"]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
