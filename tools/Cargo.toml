[package]
name = "grid-tools"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
herdr-agent-grid = { path = ".." }
serde_json = "1"
tempfile = "3"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
toml_edit = "0.23"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "xtask"
path = "src/main.rs"
